<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskManager - Tarefas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div id="headerContent">
            <div>
                <a href="index.html">
                    <!-- fonte: https://www.flaticon.com/br/icones-gratis/lista -->
                    <img src="imgs/tasks.png" alt="Ícone da logo do site">
                </a>
                <h1>TaskManager</h1>
            </div>
            <menu>
                <a id="changeSearch" class="headerButton">
                    <img src="imgs/search.png" alt="Ícone de pesquisa">
                </a>
                <a href="index.html" class="headerButton">
                    <!-- fonte: https://www.flaticon.com/free-icons/discover -->
                    <img src="imgs/tasks.png" alt="Ícone da logo do site">
                </a>
                <a href="graphics.html" class="headerButton">
                    <!-- fonte: https://www.flaticon.com/free-icons/graph-pie -->
                    <img src="imgs/graphics.png" alt="Ícone de gráfico">
                </a>
                <a class="headerButton" id="timerButton">
                    <!-- fonte: https://www.flaticon.com/free-icons/timer -->
                    <img src="imgs/timer.png" alt="Ícone de gráfico">
                </a>
                <a class="headerButton" id="changeLightButton">
                    <!-- fonte: https://www.flaticon.com/free-icons/night-mode e https://www.flaticon.com/free-icons/mode -->
                    <img src="imgs/light mode.png" alt="Ícone de modo" id="modesImage">
                </a>
            </menu>
        </div>
        <div id="containerSearch" class="hidden">
            <input id="search" type="text" placeholder="Pesquisar tarefa por Título">
        </div>  
        <div id="divActionButtons" class="hidden">
            <button id="searchButton">🔍</button>
            <button id="filterButton">🔘</button>
        </div>
    </header>

    <div id="pageContent">
        <div id="filterContainer" class="container hidden"> 
            <div id="addFilter">
                <label for="selectFilter">Selecione um filtro para a pesquisa</label>
                <select id="selectFilter">
                    <option value="taskTitle">Título</option>
                    <option value="taskDescription">Descrição</option>
                    <option value="taskDate">Prazo</option>
                    <option value="taskPriority">Prioridade</option>
                    <option value="taskProgress">Status</option>
                </select>
                <button class="button" id="chooseFilterButton">Selecionar filtro</button>
            </div>
        </div>

        <div id="exportTasksContainer" class="container hidden"> 
            <div id="exportTasksDiv">
                <div id="tasksExportInformation">
                    <div>
                        <h1>JSON</h1>
                        <div id="tasksJSON">teste</div>
                    </div>
                    <div>
                        <h1>CSV</h1>
                        <div id="tasksCSV">teste</div>
                    </div>
                </div>
                <button class="button" id="closeExportTasksMenu">Fechar</button>
            </div>
        </div>

        <div id="timerContainer" class="container hidden"> 
            <div id="addTimer">
                <div id="slider">
                    <!-- Horas - Primeiro dígito -->
                    <div class="timer">
                        <a class="timerButton timerUp">
                            <!-- fonte: https://www.flaticon.com/br/icones-gratis/triangulo -->
                            <img src="imgs/seta.png" alt="Ícone de gráfico">
                        </a>
                        <div id="frameTimerSliderHours1" class="frameTimer">
                            <div id="timerSliderHours1" class="timerSlider">
                                <h1>9</h1>
                                <h1>0</h1>
                                <h1>1</h1>
                                <h1>2</h1>
                                <h1>3</h1>
                                <h1>4</h1>
                                <h1>5</h1>
                                <h1>6</h1>
                                <h1>7</h1>
                                <h1>8</h1>
                                <h1>9</h1>
                                <h1>0</h1>
                            </div>
                        </div>
                        <a class="timerButton timerDown">
                            <!-- fonte: https://www.flaticon.com/br/icones-gratis/triangulo -->
                            <img src="imgs/seta.png" alt="Ícone de gráfico">
                        </a>
                    </div>
                    <!-- Horas - Segundo dígito -->
                    <div class="timer">
                        <a class="timerButton timerUp">
                            <!-- fonte: https://www.flaticon.com/br/icones-gratis/triangulo -->
                            <img src="imgs/seta.png" alt="Ícone de gráfico">
                        </a>
                        <div id="frameTimerSliderHours2" class="frameTimer">
                            <div id="timerSliderHours2" class="timerSlider">
                                <h1>9</h1>
                                <h1>0</h1>
                                <h1>1</h1>
                                <h1>2</h1>
                                <h1>3</h1>
                                <h1>4</h1>
                                <h1>5</h1>
                                <h1>6</h1>
                                <h1>7</h1>
                                <h1>8</h1>
                                <h1>9</h1>
                                <h1>0</h1>
                            </div>
                        </div>
                        <a class="timerButton timerDown">
                            <!-- fonte: https://www.flaticon.com/br/icones-gratis/triangulo -->
                            <img src="imgs/seta.png" alt="Ícone de gráfico">
                        </a>
                    </div>
                    <!-- Divisão dos sliders -->
                    <div id="timerSliderDivision">
                        <h1>:</h1>
                    </div>
                    <!-- Minutos - Primeiro dígito -->
                    <div class="timer">
                        <a class="timerButton timerUp">
                            <!-- fonte: https://www.flaticon.com/br/icones-gratis/triangulo -->
                            <img src="imgs/seta.png" alt="Ícone de gráfico">
                        </a>
                        <div id="frameTimerSliderMinutes1" class="frameTimer">
                            <div id="timerSliderMinutes1" class="timerSlider">
                                <h1>5</h1>
                                <h1>0</h1>
                                <h1>1</h1>
                                <h1>2</h1>
                                <h1>3</h1>
                                <h1>4</h1>
                                <h1>5</h1>
                                <h1>0</h1>
                            </div>
                        </div>
                        <a class="timerButton timerDown">
                            <!-- fonte: https://www.flaticon.com/br/icones-gratis/triangulo -->
                            <img src="imgs/seta.png" alt="Ícone de gráfico">
                        </a>
                    </div>
                    <!-- Minutos - Segundo dígito -->
                    <div class="timer">
                        <a class="timerButton timerUp">
                            <!-- fonte: https://www.flaticon.com/br/icones-gratis/triangulo -->
                            <img src="imgs/seta.png" alt="Ícone de gráfico">
                        </a>
                        <div id="frameTimerSliderMinutes2" class="frameTimer">
                            <div id="timerSliderMinutes2" class="timerSlider">
                                <h1>9</h1>
                                <h1>0</h1>
                                <h1>1</h1>
                                <h1>2</h1>
                                <h1>3</h1>
                                <h1>4</h1>
                                <h1>5</h1>
                                <h1>6</h1>
                                <h1>7</h1>
                                <h1>8</h1>
                                <h1>9</h1>
                                <h1>0</h1>
                            </div>
                        </div>
                        <a class="timerButton timerDown">
                            <!-- fonte: https://www.flaticon.com/br/icones-gratis/triangulo -->
                            <img src="imgs/seta.png" alt="Ícone de gráfico">
                        </a>
                    </div>
                </div>
                <div id="timerButtons">
                    <button class="button" id="startTimer">Iniciar timer</button>
                    <button class="button" id="timerFocusMode">Foco</button>
                    <button class="button" id="timerTiredMode">Descanso</button>
                    <button class="button" id="closeTimer">Fechar</button>
                </div>
            </div>
            
        </div>
    
        <div id="taskInformation">
            <h1 class="title" id="tasksTitle">Tarefas</h1>
            <button class="button" id="exportTasks">Exportar</button>
        </div>
        <div class="tasks" id="tasksDiv"></div>
    
        <div id="addTasksContainer" class="container hidden">
            <div id="addTasks">
                <label for="taskTitle">Título da tarefa</label>
                <input type="text" id="taskTitle">
    
                <label for="taskDescription">Descrição da tarefa</label>
                <input type="text" id="taskDescription">
    
                <label for="taskDate">Prazo da tarefa</label>
                <input type="datetime-local" id="taskDate">
    
                <label for="taskPriority">Prioridade da tarefa</label>
                <select name="option" id="taskPriority">
                    <option>Baixa</option>
                    <option>Normal</option>
                    <option>Alta</option>
                    <option>Urgente</option>
                </select>
    
                <label for="taskProgress">Progressso da tarefa</label>
                <select name="option" id="taskProgress">
                    <option>Pendente</option>
                    <option>Em andamento</option>
                    <option>Concluída</option>
                </select>
    
                <button class="button" id="addTaskButton">Adicionar tarefa</button>
    
                <button class="button" id="closeTaskMenuButton">Cancelar</button>
            </div>
        </div>
    </div>
    <audio id="completeTimer">
        <source src="audio/timer.mp3" type="audio/mp3">
        Your browser does not support the audio element.
      </audio>
    <script src="app.js"></script>
</body>
</html>
