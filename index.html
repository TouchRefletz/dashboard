<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Interativo de Tarefas e Progresso</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="containerSearch">
        <input id="search" type="text" placeholder="Pesquisar tarefa por Título">
        <button id="searchButton">🔍</button>
        <button id="filterButton">🔘</button>
    </div>  

    <div id="filterContainer" class="container hidden"> 
        <div id="addFilter">
            <label for="selectFilter">Selecione um filtro para a pesquisa</label>
            <select id="selectFilter">
                <option value="tasktitle">Título</option>
                <option value="taskdescription">Descrição</option>
                <option value="taskdate">Prazo</option>
                <option value="taskpriority">Prioridade</option>
                <option value="taskprogress">Status</option>
            </select>
            <button class="button" id="chooseFilterButton">Selecionar filtro</button>
        </div>
    </div>

    <div class="tasks" id="tasksDiv"></div>

    <div id="graphicsContainer">
        <canvas id="graphics"></canvas>
        <canvas id="graphicsColors"></canvas>
    </div>

    <div id="addTasksContainer" class="container hidden">
        <div id="addTasks">
            <label for="taskTitle">Título da tarefa</label>
            <input type="text" id="taskTitle">

            <label for="taskDescription">Descrição da tarefa</label>
            <input type="text" id="taskDescription">

            <label for="taskDate">Prazo da tarefa</label>
            <input type="datetime-local" id="taskDate">

            <label for="taskPriority">Prioridade da tarefa</label>
            <select name="option" id="taskPriority">
                <option>Baixa</option>
                <option>Normal</option>
                <option>Alta</option>
                <option>Urgente</option>
            </select>

            <label for="taskProgress">Progressso da tarefa</label>
            <select name="option" id="taskProgress">
                <option>Pendente</option>
                <option>Em andamento</option>
                <option>Concluída</option>
            </select>

            <button class="button" id="addTaskButton">Adicionar tarefa</button>

            <button class="button" id="closeTaskMenuButton">Cancelar</button>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
