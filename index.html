<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Interativo de Tarefas e Progresso</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="tasks" id="tasksDiv"></div>


    <div id="addTasksContainer" class="container hidden">
        <div id="addTasks">
            <label for="taskTitle">Título da tarefa</label>
            <input type="text" id="taskTitle">

            <label for="taskDescription">Descrição da tarefa</label>
            <input type="text" id="taskDescription">

            <label for="taskDate">Prazo da tarefa</label>
            <input type="datetime-local" id="taskDate">

            <label for="taskPriority">Prioridade da tarefa</label>
            <select name="option" id="taskPriority">
                <option>Baixa</option>
                <option>Normal</option>
                <option>Alta</option>
                <option>Urgente</option>
            </select>

            <label for="taskProgress">Progressso da tarefa</label>
            <select name="option" id="taskProgress">
                <option>Pendente</option>
                <option>Em andamento</option>
                <option>Concluída</option>
            </select>

            <button class="button" id="addTaskButton">Adicionar tarefa</button>

            <button class="button" id="closeTaskMenuButton">Cancelar</button>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
